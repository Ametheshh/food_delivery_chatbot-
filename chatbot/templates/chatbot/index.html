<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Delivery Assistant</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #5b6775;
      --brand: #e85d04;
      --brand-dark: #c24a00;
      --bot-bubble: #fff4ec;
      --user-bubble: #1c2430;
      --border: #e4e9ef;
      --danger: #c1121f;
      --shadow: 0 12px 40px rgba(28, 36, 48, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(232, 93, 4, 0.18), transparent 40%),
        radial-gradient(circle at bottom right, rgba(28, 36, 48, 0.08), transparent 35%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chat-shell {
      width: min(720px, 100%);
      height: min(860px, 92vh);
      background: var(--panel);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: linear-gradient(135deg, #ff7b2e, var(--brand) 55%, #b23a00);
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .chat-header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      opacity: 0.92;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        linear-gradient(180deg, #fffaf6 0%, #ffffff 40%, #f8fafc 100%);
    }

    .row {
      display: flex;
      max-width: 85%;
    }

    .row.bot { align-self: flex-start; }
    .row.user { align-self: flex-end; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid #ffd8bf;
      border-bottom-left-radius: 6px;
      color: var(--ink);
    }

    .row.user .bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .row.user .meta { text-align: right; }

    .composer {
      border-top: 1px solid var(--border);
      padding: 16px;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    .composer input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .composer input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.15);
    }

    .composer button {
      border: none;
      background: var(--brand);
      color: white;
      border-radius: 999px;
      padding: 0 22px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .composer button:hover { background: var(--brand-dark); }
    .composer button:active { transform: scale(0.98); }
    .composer button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      align-self: flex-start;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 4px 8px;
    }

    .loading.visible { display: block; }

    .error {
      display: none;
      margin: 0 16px 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #ffe5e8;
      color: var(--danger);
      font-size: 0.88rem;
    }

    .error.visible { display: block; }

    .dots span {
      animation: blink 1.2s infinite;
      opacity: 0.2;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      .chat-shell {
        height: 100vh;
        border-radius: 0;
        width: 100%;
      }
      .row { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="chat-shell">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">🍔</div>
      <div>
        <h1>Food Delivery Assistant</h1>
        <p>Order tracking • Coupons • Support tickets</p>
      </div>
    </header>

    <main class="messages" id="messages" aria-live="polite">
      <div class="row bot">
        <div>
          <div class="meta">Bot</div>
          <div class="bubble">Hi! 👋 How can I help you today?</div>
        </div>
      </div>
    </main>

    <div class="loading" id="loading">
      Assistant is typing<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="error" id="error" role="alert"></div>

    <form class="composer" id="chat-form">
      <input
        id="message-input"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        maxlength="1000"
        required
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(";").shift();
      return "";
    }

    function appendMessage(role, text) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      row.innerHTML = `
        <div>
          <div class="meta">${role === "user" ? "You" : "Bot"}</div>
          <div class="bubble"></div>
        </div>
      `;
      row.querySelector(".bubble").textContent = text;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(isLoading) {
      loadingEl.classList.toggle("visible", isLoading);
      sendBtn.disabled = isLoading;
      inputEl.disabled = isLoading;
      if (isLoading) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("visible");
    }

    function clearError() {
      errorEl.textContent = "";
      errorEl.classList.remove("visible");
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      const message = inputEl.value.trim();
      if (!message) {
        showError("Please enter a message so I can help you.");
        return;
      }

      appendMessage("user", message);
      inputEl.value = "";
      setLoading(true);

      try {
        const response = await fetch("/api/chat/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify({ message }),
        });

        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`);
        }

        const data = await response.json();
        appendMessage("bot", data.message || "Sorry, I could not process that.");
      } catch (err) {
        showError("Something went wrong while contacting support. Please try again.");
        appendMessage(
          "bot",
          "I'm having trouble reaching the server right now. Please try again in a moment."
        );
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    });

    inputEl.focus();
  </script>
</body>
</html>
